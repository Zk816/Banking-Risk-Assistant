[project]
name = "fin-assistant"
version = "0.1.0"
description = "Cited, numbers-first AI assistant for Kazakhstan's financial sector"
requires-python = ">=3.12,<3.13"

dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.3",
    "openai>=1.57",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "networkx>=3.6.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pypdf>=6.19.0",
    "pymupdf>=1.28.2",
    "chainlit>=2.12.0",
    "requests>=2.34.2",
    "langfuse>=3",
    "asyncpg>=0.31.0",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
finetune = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"
