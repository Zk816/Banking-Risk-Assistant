name: rag_fin

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "3"}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: user7-db
    logging: *logging
    environment:
      POSTGRES_USER: kzbank
      POSTGRES_PASSWORD: kzbank
      POSTGRES_DB: kzbank
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - kzbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kzbank -d kzbank"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm:
    image: vllm/vllm-openai:v0.28.0
    container_name: user7-llm
    logging: *logging
    ipc: host
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_PROCESS_NAME_PREFIX: user7
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    command:
      - --model=Qwen/Qwen3.8-27B-FP8
      - --served-model-name=qwen3.8-27b
      - --max-model-len=131072
      - --kv-cache-dtype=fp8
      - --max-num-seqs=64
      - --gpu-memory-utilization=${LLM_GPU_SHARE:-0.55}
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
    ports:
      - "127.0.0.1:8320:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU:-7}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: user7-api
    logging: *logging
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kzbank:kzbank@db:5432/kzbank
      LLM_BASE_URL: http://llm:8000/v1
      LLM_MODEL: qwen3.8-27b
      EMBED_DEVICE: cuda:0
      RAW_DATA_DIR: /app/data/raw
      LANGFUSE_HOST: http://sia-langfuse:3000
      SEARXNG_URL: http://search:8080
    ports:
      - "127.0.0.1:8400:8020"
    volumes:
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/models:ro
      - kzbank_logs:/app/logs
    networks: [default, tracing]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${API_GPU:-7}"]
              capabilities: [gpu]
    restart: unless-stopped

  search:
    image: searxng/searxng:latest
    container_name: user7-search
    logging: *logging
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8402:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: user7-ui
    logging: *logging
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    depends_on:
      - api
      - db
    environment:
      KZBANK_API_URL: http://api:8020
      KZBANK_API_KEY: ${UI_API_KEY:-}
      DATABASE_URL: postgresql://kzbank:kzbank@db:5432/chainlit
      CHAT_USERS: ${CHAT_USERS:?set CHAT_USERS in .env (scripts/chat_user.py)}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?set CHAINLIT_AUTH_SECRET in .env}
    command: ["chainlit", "run", "src/fin_assistant/ui/chat_app.py", "--host", "0.0.0.0", "--port", "8000", "--headless"]
    ports:
      - "8401:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  kzbank_pgdata:
  kzbank_logs:

networks:
  tracing:
    name: selfimproving-agent_default
    external: true
